# The primary case: see mvp/primary-case.md.
# Copy to "Topic Radar/watches/ai-engineering.yaml", then run: topic-radar init ai-engineering
name: AI engineering

interests: |
  Where AI engineering is going, for someone who uses coding agents every day and
  builds tools that call models at runtime.

  Coding agents (Claude Code, GitHub Copilot in VS Code, Devin and their peers):
  new capabilities and how to get the most from them — skills, subagents,
  instruction files, prompts and prompt files, hooks, MCP servers, plan and agent
  modes, background and cloud agents, review workflows. Above all: how to keep
  cost and usage down (pricing, plans and usage limits included) without losing quality (model choice per task, context
  size, caching, when to use a subagent, when not to).

  Building with models at runtime: agent frameworks (LangGraph and others),
  structured output, tool calling, evaluation and testing of model-driven code,
  small and local models (Ollama, MLX), running well on a laptop, reliability
  patterns, and what changed in model releases that matters to builders
  (context, price, speed, tool use), not the leaderboard.

  I want articles worth 15+ minutes: first-hand experience with numbers, primary
  sources (release notes, official engineering posts, papers), and clear
  arguments about where the field is heading.

not_interested: |
  Listicles and "top 10 tips" that repeat the basics. Funding rounds, valuations,
  executive moves, lawsuits. AI art, image and video generation. Benchmarks with
  no method or no practical meaning. Vendor marketing with no technical detail.
  Opinion threads and hot takes. General "AI will change everything" pieces.
  Minor patch releases that only fix bugs I'd never hit.

already_know: |
  Things I already know, so the report doesn't keep telling me:
  - Keep an instruction file (CLAUDE.md, copilot-instructions.md, AGENTS.md) with project rules.
  - Use subagents to keep the main context small and to fan out searches.
  - Use a cheaper or faster model for simple tasks.
  - Give agents tests to run so they can check their own work.
  - Plan before letting an agent edit code.
  - Prompt caching lowers cost for repeated context.
  - MCP lets agents call outside tools.
  - Build each model prompt fresh instead of growing a conversation, for small models.
  - Ask small models for structured output and validate it in code.


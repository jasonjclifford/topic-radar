[project]
name = "topic-radar"
version = "0.1.0"
description = "A local digest of what's new in the topics you follow"
requires-python = ">=3.12,<3.13"
dependencies = [
  "typer",
  "httpx",
  "feedparser",
  "trafilatura",
  "pydantic",
  "ruamel.yaml",
  "rapidfuzz",
]

[project.scripts]
topic-radar = "topic_radar.cli:app"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topic_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not real_model'"
markers = ["real_model: needs a running Ollama with the real model; deselected by default"]
